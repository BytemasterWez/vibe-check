services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: maglab
      POSTGRES_PASSWORD: maglab
      POSTGRES_DB: maglab
    ports:
      - "5432:5432"
    volumes:
      - maglab-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maglab"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://maglab:maglab@db:5432/maglab
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  maglab-pgdata:
