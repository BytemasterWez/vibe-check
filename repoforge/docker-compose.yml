# RepoForge — application + PostgreSQL 16 with pgvector.
# Ollama runs NATIVELY on macOS (not here) for Apple-Silicon acceleration;
# the app reaches it at http://host.docker.internal:11434.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repoforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-repoforge}
    volumes:
      # Data directory lives on the external APFS volume (see .env).
      - ${REPOFORGE_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repoforge} -d ${POSTGRES_DB:-repoforge}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published to the host by default — only the app needs it.
    expose:
      - "5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      REPOFORGE_MODE: ${REPOFORGE_MODE:-local_ai}
      # Inside the container the data volume is always mounted at /data; the host
      # path (REPOFORGE_DATA_DIR in .env) is only the volume *source* below.
      REPOFORGE_DATA_DIR: /data
      REPOFORGE_PORT: ${REPOFORGE_PORT:-18765}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_BUDGET_PER_HOUR: ${GITHUB_API_BUDGET_PER_HOUR:-1000}
      GITHUB_MAX_CONCURRENCY: ${GITHUB_MAX_CONCURRENCY:-3}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CLASSIFIER_MODEL: ${OLLAMA_CLASSIFIER_MODEL:-}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      POSTGRES_USER: ${POSTGRES_USER:-repoforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-repoforge}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      TIMEZONE: ${TIMEZONE:-Europe/London}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${REPOFORGE_PORT:-18765}:18765"
    volumes:
      - ${REPOFORGE_DATA_DIR:-./data}:/data
    extra_hosts:
      # Ensures host.docker.internal resolves on Linux hosts too.
      - "host.docker.internal:host-gateway"
