# TreasureMap US — monetisation products, targets and hard safety rails.

products:
  claim_recovery_lead_pack:
    engine: claimable_funds
    description: Qualified business-claimant lead pack (evidence cards + entity resolution)
    target_buyers: [bankruptcy claims specialists, commercial recovery firms, insolvency practitioners, attorneys]
    price_test_usd: {min: 250, max: 1000, unit: per qualified lead pack}
    alt_model: referral or success fee where lawful (check states.yaml recovery_fee_note first)
  government_asset_opportunity_pack:
    engine: government_assets
    description: Enriched asset card pack (flood/OZ/zoning/access analysis on thin listings)
    target_buyers: [small developers, investors, brownfield redevelopers, local governments, conservation buyers]
    price_test_usd: {min: 500, max: 2500, unit: per asset pack}
  weekly_treasuremap_subscription:
    engine: combined
    description: Weekly early-access report across both engines
    target_buyers: [asset recovery firms, real estate investors, surplus asset buyers, attorneys]
    price_test_usd: {min: 99, max: 499, unit: per month}

outreach:
  # PHASE 1 allowed recipient categories — commercial/professional only.
  allowed_recipient_types:
    - bankruptcy attorney
    - asset recovery firm
    - insolvency practitioner
    - registered agent
    - corporate officer (active entity)
    - developer
    - surplus property investor
    - commercial real estate investor
    - local government
    - nonprofit
  # Never contacted first, ever (hard safety rule).
  prohibited_first_contact:
    - individual consumer
    - heir / estate beneficiary
    - vulnerable person
  manual_send_only: true          # V1: no automated outreach at all
  weekly_manual_send_cap: 10

hard_rules:
  - Do not pretend entitlement without evidence.
  - Do not submit claims on anyone's behalf.
  - Do not impersonate claimants.
  - Do not contact vulnerable individuals first.
  - Do not charge where state law prohibits or caps fees (see states.yaml).
  - Do not bypass CAPTCHA.
  - Do not scrape restricted systems or violate ToS.
  - Do not recommend bidding without title/environmental review fields complete.
  - No SELL_CANDIDATE without a clear route to money or asset control.
  - No consumer-facing outreach generated by default.
