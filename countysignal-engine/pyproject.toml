[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "countysignal-engine"
version = "0.1.0"
description = "Product-agnostic national county signal substrate"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "redis>=5.0",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "httpx"]
storage = ["boto3>=1.34"]

[tool.setuptools.packages.find]
include = ["engine*", "adapters*", "services*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live Postgres (set CSE_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
