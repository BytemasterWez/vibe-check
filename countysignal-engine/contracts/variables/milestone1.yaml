  - variable_id: fema_nri_social_vulnerability
    source_id: fema_nri
    name: NRI social vulnerability score
    unit: index_0_100
    time_grain: static
    geography_grain: county
    directionality: index
    higher_is_good: false
    transform_allowed: true
    source_field: social_vuln_score
    normalisation_method: direct
    missing_value_policy: "null"

  - variable_id: fema_nri_community_resilience
    source_id: fema_nri
    name: NRI community resilience score
    unit: index_0_100
    time_grain: static
    geography_grain: county
    directionality: index
    higher_is_good: true
    transform_allowed: true
    source_field: community_resilience_score
